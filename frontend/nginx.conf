server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers. Recharts sets inline styles, hence 'unsafe-inline' for styles only.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    # The browser only talks to nginx; nginx forwards API calls to FastAPI.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Everything with one command:  docker compose up --build
#   website      http://localhost:8080
#   API docs     http://localhost:8000/api/docs
#   Prefect UI   http://localhost:4200
services:
  prefect:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0
    ports: ["4200:4200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Runs the whole flow once so the API has data on first start.
  pipeline-init:
    build: .
    command: python -m petlr.flows
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    volumes: ["data:/data"]
    depends_on:
      prefect: { condition: service_healthy }

  # Stays up and re-runs the flow every day at 06:00 (see the Prefect UI).
  scheduler:
    build: .
    command: python -m petlr.flows --serve
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    volumes: ["data:/data"]
    depends_on:
      pipeline-init: { condition: service_completed_successfully }
    restart: unless-stopped

  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["data:/data"]
    depends_on:
      pipeline-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  data:

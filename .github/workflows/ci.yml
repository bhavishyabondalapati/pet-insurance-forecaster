name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest
      - name: Pipeline smoke test (generate -> clean -> back-test -> monitor)
        run: |
          python -m petlr.generate
          python -m petlr.pipeline
          python -m petlr.backtest
          python -m petlr.monitoring

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start everything
        run: docker compose up -d --build
      - name: Wait for the website to serve API data
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/health | grep -q '"ok"'; then
              curl -fs http://localhost:8080/api/segments | head -c 300; echo
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Stop
        if: always()
        run: docker compose down -v
